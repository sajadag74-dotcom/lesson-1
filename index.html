<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sajad Gallery</title>
    <style>
        body {
            background-color: #1a1a1e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; margin: 0 0 10px 0; color: #ffffff; }
        .header p { font-size: 1rem; color: #b0b0b0; margin: 0; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }
        .card {
            background-color: #24242b;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            display: block;
            background-color: #333;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 0 5px;
            font-size: 0.9rem;
            color: #b0b0b0;
        }
        .reveal-text {
            color: #b0b0b0;
            transition: color 0.3s;
            text-align: right;
            max-width: 60%;
        }
        .reveal-text.revealed {
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>sajad</h1>
        <p>Tap a picture to reveal its name and hear the sound.</p>
    </div>

    <div class="gallery">
        <!-- Picture 1 -->
        <div class="card" id="card-1" onclick="revealName('card-1', 'audio-1')">
            <!-- Notice the image source is exactly earth.jpg -->
            <img src="earth.jpg" alt="Earth">
            <div class="card-footer">
                <span class="label">Picture 1</span>
                <span class="reveal-text" data-name="We live on Earth">Click to reveal</span>
            </div>
        </div>

        <!-- Picture 2 -->
        <div class="card" id="card-2" onclick="revealName('card-2', 'audio-2')">
            <!-- Notice the image source is exactly tiger.jpg -->
            <img src="tiger.jpg" alt="Tiger">
            <div class="card-footer">
                <span class="label">Picture 2</span>
                <span class="reveal-text" data-name="A tiger is a wild animal">Click to reveal</span>
            </div>
        </div>

        <!-- Picture 3 -->
        <div class="card" id="card-3" onclick="revealName('card-3', 'audio-3')">
            <!-- Notice the image source is exactly forest.jpg -->
            <img src="forest.jpg" alt="Forest">
            <div class="card-footer">
                <span class="label">Picture 3</span>
                <span class="reveal-text" data-name="I went to Golestan Forest last year">Click to reveal</span>
            </div>
        </div>

        <!-- Picture 4 -->
        <div class="card" id="card-4" onclick="revealName('card-4', 'audio-4')">
            <!-- Notice the image source is exactly wood.jpg -->
            <img src="wood.jpg" alt="Woodcutter">
            <div class="card-footer">
                <span class="label">Picture 4</span>
                <span class="reveal-text" data-name="They are destroying the jungle">Click to reveal</span>
            </div>
        </div>
    </div>

    <!-- Audio Files -->
    <audio id="audio-1" src="earth.mp3"></audio>
    <audio id="audio-2" src="tiger.mp3"></audio>
    <audio id="audio-3" src="forest.mp3"></audio>
    <audio id="audio-4" src="wood.mp3"></audio>

    <script>
        function revealName(cardId, audioId) {
            const cardElement = document.getElementById(cardId);
            const textElement = cardElement.querySelector('.reveal-text');
            const audioElement = document.getElementById(audioId);
            
            // Play Sound
            if (audioElement) {
                audioElement.currentTime = 0; 
                audioElement.play().catch(e => console.log("Audio error:", e));
            }

            // Reveal Text
            if (!textElement.classList.contains('revealed')) {
                textElement.textContent = textElement.getAttribute('data-name');
                textElement.classList.add('revealed');
            }
        }
    </script>

</body>
</html>
